<path d="M1550 70 L1538 110 L1550 100 L1562 110 Z" fill="#333"/><text x="1550" y="130" font-size="14" text-anchor="middle" fill="#333">С</text>
<line x1="60" y1="1590.0" x2="310.0" y2="1590.0" stroke="#333" stroke-width="3"/><text x="185.0" y="1608.0" font-size="12" text-anchor="middle" fill="#333">500 м</text>
<text x="60" y="1640.0" font-size="14" font-weight="bold" fill="#222">Как рисовать карту мира «Берсерк 3D» (круг — граница мира, 3 км в поперечнике):</text>
<text x="60" y="1662.0" font-size="13" font-weight="normal" fill="#222">1. Каждую землю залей сплошным цветом без градиента и сглаживания краёв (кисть с жёстким краем).</text>
<text x="60" y="1684.0" font-size="13" font-weight="normal" fill="#222">2. Лагерь (жёлтый круг) не трогай: это стартовая земля 1–20. Чем дальше от лагеря — тем выше уровни (до 80).</text>
<text x="60" y="1706.0" font-size="13" font-weight="normal" fill="#222">3. Рядом с картой или отдельным списком: цвет → имя земли → биом (лес / топь / горы / пустошь / берег) → уровни «от–до».</text>
<text x="60" y="1728.0" font-size="13" font-weight="normal" fill="#222">4. По желанию: синей линией — реку, тонкой чёрной — главные дороги, ★ — лагеря, ■ — замок.</text>
<text x="60" y="1750.0" font-size="13" font-weight="normal" fill="#222">5. Пришли картинку PNG (можно фото) — я переведу её в игровую карту и предупрежу о резких скачках уровня на стыках.</text>
