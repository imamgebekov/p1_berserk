# Публикация игры на GitHub Pages: тесты → сборка → публикация.
# Один раз включите: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Быстрые тесты ядра (полный набор — у разработчика перед пушем, npm run check:full)
        run: npm run test:ci
      - name: Сборка
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true     # пробуем включить Pages автоматически (может не хватить прав токена — тогда включите вручную)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
